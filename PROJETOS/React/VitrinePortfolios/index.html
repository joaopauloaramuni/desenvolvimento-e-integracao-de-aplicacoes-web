<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vitrine dos portfólios desenvolvidos pelos alunos de DIW e DIAW da PUC Minas, 2º semestre de 2026." />
    <title>Vitrine de Portfólios - PUC Minas</title>

    <!-- Aplica o tema salvo antes de desenhar a página (evita piscar claro/escuro) -->
    <script>
      try {
        const tema = localStorage.getItem("vitrine-tema");
        if (tema === "light" || tema === "dark") document.documentElement.dataset.theme = tema;
      } catch {}
    </script>

    <!-- Fonte JetBrains Mono - Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap"
      rel="stylesheet"
    />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
